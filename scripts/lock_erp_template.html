<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#293172">
<title>ERP Home Capital · acesso restrito</title>
<!-- PWA / instalar no iPhone e Android -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="assets/favicon-64.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ERP HC">
<style>
:root{--navy:#293172;--acc:#046BD2;--bg:#0e1420;--line:#27364a;--mut:#9fb0c3;--bad:#e0603a}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
 background:linear-gradient(160deg,#0b1018 0%,#161f2e 55%,#293172 160%);
 font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
 color:#e7edf5;padding:20px;padding-top:max(20px,env(safe-area-inset-top))}
.card{background:#111826;border:1px solid var(--line);border-radius:16px;max-width:380px;width:100%;
 padding:32px 26px;text-align:center;box-shadow:0 24px 70px rgba(4,10,25,.6)}
.card img{width:100%;max-width:190px;height:auto;margin:0 auto 4px;display:block;
 background:#fff;border-radius:12px;padding:14px}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);font-weight:700;margin-top:22px}
h1{font-weight:750;font-size:20px;margin:6px 0 4px;line-height:1.25}
p.sub{font-size:13px;color:var(--mut);font-weight:400;line-height:1.5}
.lock{font-size:26px;margin-top:14px}
input{width:100%;margin-top:18px;padding:14px;border:1.5px solid var(--line);border-radius:10px;
 background:#0b1018;font-size:22px;font-weight:600;text-align:center;letter-spacing:.4em;
 color:#e7edf5;outline:none}
input:focus{border-color:var(--acc)}
button.go{width:100%;margin-top:12px;padding:14px;border:0;border-radius:10px;background:var(--acc);color:#fff;
 font-weight:700;font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;min-height:50px}
button.go:disabled{opacity:.55}
.err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:16px}
.foot{margin-top:22px;font-size:10.5px;color:var(--mut);line-height:1.5}
.foot a{color:var(--acc);text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <img src="data:image/png;base64,__HCM__" alt="Home Capital">
  <div class="eyebrow">ERP · uso interno</div>
  <h1>ERP Home Capital</h1>
  <p class="sub">Sistema de gestão de acesso restrito.<br>Informe seu código para entrar.</p>
  <div class="lock">🔒</div>
  <input id="code" inputmode="numeric" autocomplete="current-password" maxlength="24" placeholder="••••••" aria-label="Código de acesso">
  <button class="go" id="go">Entrar</button>
  <div class="err" id="err"></div>
  <div class="foot">Conteúdo protegido com criptografia AES-256.<br>Home Capital · <a href="https://homecapital.net.br/" target="_blank" rel="noopener">homecapital.net.br</a></div>
</div>
<script id="vault" type="application/json">__PAYLOAD__</script>
<script>
const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(){
  const code=$('code').value.trim();
  if(!code){$('err').textContent='Digite o código.';return;}
  $('go').disabled=true;$('err').textContent='Verificando…';
  try{
    const v=JSON.parse($('vault').textContent);
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(v.s),iterations:310000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(v.i)},key,b64(v.c));
    const html=new TextDecoder().decode(plain);
    document.open();document.write(html);document.close();
  }catch(e){
    $('go').disabled=false;
    $('err').textContent='Código incorreto.';
    $('code').value='';$('code').focus();
  }
}
$('go').addEventListener('click',abrir);
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')abrir();});
$('code').focus();
/* Registra o service worker (offline) — só em https/localhost */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
